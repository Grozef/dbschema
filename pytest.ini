[pytest]
testpaths = tests
# test_*.py seulement : compat_test.py est un script (matrice Docker), jamais collecte
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    unit: sans base ni navigateur (3 OS en CI)
    functional: base MySQL ou MariaDB requise
    e2e: chaine complete (dbschema.sh, base, navigateur)
    perf: budgets de temps et de taille (tests/perf/budgets.json)
    security: securite (bac a sable, filtre, XSS, arguments)
